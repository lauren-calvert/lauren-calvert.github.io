media:
  input: assets/images/uploads
  output: /assets/images/uploads
  rename: safe
  categories: [image]

content:
  - name: jobs
    label: Job postings
    type: collection
    path: _jobs
    format: yaml-frontmatter
    filename:
      template: "{title}.md"
      field: create
    view:
      fields: [title, status, location, employment_type, featured]
      primary: title
      sort: [status, title, location]
      search: [title, location, employment_type, summary]
      default:
        sort: status
        order: asc
    fields:
      - name: title
        label: Position title
        type: string
        required: true
      - name: application_role
        label: Application role code
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: Lowercase words separated by hyphens, such as full-time-nanny.
      - name: status
        label: Status
        type: select
        required: true
        options:
          values: [Open, Draft, Filled]
      - name: featured
        label: Featured role
        type: boolean
        default: false
      - name: label
        label: Card label
        type: string
        required: false
        description: "Example: Flexible schedule"
      - name: location
        label: Location
        type: string
        required: true
      - name: employment_type
        label: Employment type
        type: select
        required: true
        options:
          values: [Full-time, Part-time, Temporary, Seasonal, Overnight]
      - name: schedule
        label: Schedule summary
        type: string
        required: true
        description: "Example: Weekday afternoons"
      - name: compensation
        label: Compensation
        type: string
        required: false
        description: "Example: $23–$28 per hour"
      - name: summary
        label: Card summary
        type: text
        required: true
        options:
          minlength: 40
          maxlength: 280
      - name: body
        label: Role details
        type: rich-text
        required: true
